<fieldset
  class="m-0 grid gap-1 border-0 p-0 text-text-primary"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-errormessage]="error() ? errorId() : null"
  [attr.aria-invalid]="error() ? 'true' : null"
  [disabled]="disabled()">
  <legend class="p-0 text-sm font-semibold">
    {{ label() }}
    @if (required()) {
      <span class="text-status-danger" aria-hidden="true">*</span>
      <span class="lsd-sr-only">(required)</span>
    }
  </legend>

  @if (description()) {
    <lsd-field-message [id]="descriptionId()">{{ description() }}</lsd-field-message>
  }

  <div [class]="optionsClass()">
    @for (option of options(); track $index) {
      <label class="lsd-radio-group__target flex min-h-11 cursor-pointer items-center gap-3 text-sm" [for]="optionId($index)">
        <input
          class="h-5 w-5 shrink-0 accent-accent-primary"
          [checked]="isChecked(option)"
          [disabled]="option.disabled ?? false"
          [id]="optionId($index)"
          [name]="name()"
          [required]="required()"
          [value]="$index"
          type="radio"
          (change)="selectOption($index)" />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>

  @if (error()) {
    <lsd-field-message [id]="errorId()" kind="error">{{ error() }}</lsd-field-message>
  }
</fieldset>
