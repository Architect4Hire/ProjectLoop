<section class="lsd-document-list" [attr.aria-label]="accessibleName()">
  @if (documents().length === 0) {
    <lsd-state-feedback
      [id]="id() + '-empty'"
      kind="empty"
      [title]="emptyTitle()"
      [description]="emptyDescription()" />
  } @else {
    <div class="lsd-document-list__table" data-presentation="rows">
      <table>
        <caption class="sr-only">{{ accessibleName() }}</caption>
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Category</th>
            <th scope="col">Status</th>
            <th scope="col">Visibility</th>
            <th scope="col">Version</th>
            <th scope="col">Updated</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (document of documents(); track document.id) {
            <tr lsdDocumentRow [document]="document"></tr>
          }
        </tbody>
      </table>
    </div>

    <ol class="lsd-document-list__cards" data-presentation="cards">
      @for (document of documents(); track document.id) {
        <li><lsd-document-card [document]="document" /></li>
      }
    </ol>
  }
</section>
